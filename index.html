<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>مزامنة تعليق المباراة</title>
<style>
:root{--bg:#0b0f14;--card:#141b24;--line:#263243;--text:#eef3f8;--muted:#8fa0b3;--acc:#2ee6a6;--acc-ink:#04281d;--red:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:30rem;margin:0 auto;padding:.9rem .9rem 2.5rem;display:grid;gap:.8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:.9rem 1rem}
.row{display:flex;align-items:center;gap:.5rem}
.dot{inline-size:.65rem;block-size:.65rem;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--acc);box-shadow:0 0 0 4px rgba(46,230,166,.2)}
.name{font-weight:800;font-size:1.1rem}
.host{margin-inline-start:auto;color:var(--muted);font-size:.8rem;direction:ltr}
.status{margin-top:.4rem;font-weight:700;font-size:1.02rem;min-height:1.6rem}
.status.ok{color:var(--acc)}.status.bad{color:var(--red)}
.note{margin:.3rem 0 0;color:var(--muted);font-size:.88rem}
.note.bad{color:var(--red)}
.urlrow{display:flex;gap:.5rem}
input[type=url],select{flex:1;min-inline-size:0;background:#0f151d;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;font:inherit;font-size:.9rem}
.sm{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:0 1.1rem;font:inherit;font-weight:800;cursor:pointer}
.measure{position:relative;overflow:hidden;inline-size:100%;min-height:4rem;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font:inherit;font-size:1.2rem;font-weight:800;cursor:pointer}
.measure:disabled{cursor:default}
.measure .bar{position:absolute;inset-block:0;inset-inline-start:0;inline-size:0;background:rgba(0,0,0,.22);transition:inline-size .2s linear}
.measure span{position:relative}
.durrow{display:flex;align-items:center;gap:.6rem;margin-top:.7rem;color:var(--muted);font-size:.9rem}
.durrow select{flex:0 0 7rem}
.pills{display:flex;gap:.5rem}
.pill{flex:1;min-height:3rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;padding:0 .4rem}
.pill.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.pill:disabled{opacity:.4;cursor:default}
.pill[aria-pressed="true"]{background:#3a1f24;border-color:var(--red);color:var(--red)}
.tune{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.4rem}
.tune b{font-size:1.4rem;font-variant-numeric:tabular-nums;direction:ltr}
input[type=range]{inline-size:100%;accent-color:var(--acc);margin:.3rem 0 .6rem}
.btns{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}
.btns button{min-height:2.6rem;border-radius:12px;border:1px solid var(--line);background:#0f151d;color:var(--text);font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="row"><span class="dot" id="dot"></span><span class="name">قناة التعليق العربي</span><span class="host" id="host"></span></div>
    <div class="status" id="status" aria-live="polite"></div>
    <p class="note" id="i1"></p>
    <p class="note" id="i2"></p>
  </section>

  <section class="card">
    <div class="urlrow">
      <input id="url" type="url" dir="ltr" inputmode="url" aria-label="رابط البث" value="http://radio.anisfm.vip/live/mx/1?token=25C3ZQMNS8">
      <button class="sm" id="play" type="button">تشغيل</button>
    </div>
    <p class="note bad" id="hint"></p>
  </section>

  <section class="card">
    <button class="measure" id="mbtn" type="button"><i class="bar" id="mbar"></i><span id="mtxt">فحص التأخير</span></button>
    <div class="durrow"><label for="dur">مدة الفحص</label>
      <select id="dur"><option value="15">15 ث</option><option value="25" selected>25 ث</option><option value="40">40 ث</option><option value="60">60 ث</option></select></div>
    <p class="note">ضع الهاتف قرب التلفاز. يُكتم صوت القناة أثناء الفحص ولا يتغير شيء قبل أن تضغط «زامن الآن». الفحص الأطول أدق ويكشف تأخيراً أكبر (تقريباً مدته ناقص 8 ثوانٍ).</p>
  </section>

  <div class="pills">
    <button class="pill pri" id="sync" type="button" disabled>زامن الآن</button>
    <button class="pill" id="mute" type="button" aria-pressed="false">🔊 صوت القناة</button>
    <button class="pill" id="stopsync" type="button">إيقاف المزامنة</button>
  </div>

  <section class="card">
    <div class="tune"><span>تأخير صوت القناة</span><b id="dval">0.00 ث</b></div>
    <input id="slider" type="range" min="0" max="30" step="0.05" value="0" dir="ltr" aria-label="تأخير صوت القناة بالثواني">
    <div class="btns" dir="ltr">
      <button type="button" data-d="-5">−5 ث</button><button type="button" data-d="-1">−1 ث</button><button type="button" data-d="-0.25">−0.25</button>
      <button type="button" data-d="0.25">+0.25</button><button type="button" data-d="1">+1 ث</button><button type="button" data-d="5">+5 ث</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var $ = function (i) { return document.getElementById(i); };
  var BANDS = [[40, 250], [250, 3000], [3000, 7000]];            // ضجيج منخفض / صوت المعلق / صفير وهسيس
  var KEEP = 100, PRE = 25, MINOV = 8, MAXD = 30;                  // ثوانٍ: ذاكرة البث، ما قبل الفحص، أقل تداخل، أقصى تأخير
  var WORKLET = "class T extends AudioWorkletProcessor{constructor(){super();this.n=0;this.a=new Float32Array(4096);this.b=new Float32Array(4096)}process(i){var m=i[0]&&i[0][0],s=i[1]&&i[1][0],k=(m||s)?(m||s).length:128;for(var j=0;j<k;j++){this.a[this.n+j]=m?m[j]:0;this.b[this.n+j]=s?s[j]:0}this.n+=k;if(this.n>=4096){this.port.postMessage({a:this.a.slice(0),b:this.b.slice(0)});this.n=0}return true}}registerProcessor('tap',T)";

  var ctx = null, tap = null, dly = null, out = null, el = null, srcNode = null;
  var sr = 48000, ring = [], total = 0, meas = null, proxyOK = false;
  var playing = false, muted = false, busy = false, delay = 0, measured = null, mode = "idle";

  function f1(x) { return x.toFixed(1); }
  function f2(x) { return x.toFixed(2); }
  function status(t, cls) { var s = $("status"); s.textContent = t; s.className = "status" + (cls ? " " + cls : ""); }

  /* ---------- عرض الحالة ---------- */
  function render() {
    var D = measured ? measured.D : 0, pic = Math.max(D, 0), s, cls = "";
    if (mode === "synced") { s = "تمت المزامنة ✓ • الصورة " + f1(pic) + " ث • الصوت " + f2(delay) + " ث"; cls = "ok"; }
    else if (mode === "measured") s = "تم الفحص • الصورة " + f1(pic) + " ث • الصوت " + f2(Math.max(-D, 0)) + " ث";
    else if (mode === "manual") s = "ضبط يدوي • الصوت " + f2(delay) + " ث" + (pic > 0.05 ? " • الصورة " + f1(pic) + " ث" : "");
    else s = playing ? "البث مباشر • الصوت " + f2(delay) + " ث" : "اضغط «تشغيل» لبدء البث";
    if (!busy) status(s, cls);
    var i1 = "", i2 = "", bad = false;
    if (measured && mode !== "idle") {
      if (D > 0.05) i1 = "التلفاز متقدّم: اضبط تأخير الفيديو في الرسيفر على " + f1(D) + " ثانية، أو أوقف القناة مؤقتاً (Timeshift) بالمدة نفسها.";
      else if (D < -0.05) i1 = mode === "synced" ? "تم تأخير صوت القناة " + f2(-D) + " ثانية لتطابق الصورة." : "صوت القناة متقدّم بمقدار " + f2(-D) + " ثانية. اضغط «زامن الآن» لتأخيره.";
      else i1 = "الصوت والصورة متزامنان تقريباً.";
      var q = { HIGH: "عالية", MEDIUM: "متوسطة", LOW: "منخفضة" }[measured.q];
      bad = measured.q === "LOW";
      i2 = "الثقة: " + q + " (قوة التطابق " + f1(measured.z) + ")" + (bad ? " — اعتبر الرقم تخميناً. جرّب مدة 60 ث وأعد الفحص عند صافرة أو هتاف." : "");
    }
    $("i1").textContent = i1; $("i2").textContent = i2; $("i2").className = "note" + (bad ? " bad" : "");
    $("sync").disabled = !measured || busy;
  }
  function progress(p, label) { $("mbar").style.width = (p * 100) + "%"; $("mtxt").textContent = label; }
  function applyGain() { if (out) out.gain.value = (muted || busy) ? 0 : 1; }
  function setDelay(v) {
    delay = Math.min(MAXD, Math.max(0, Math.round(v * 100) / 100));
    if (dly) dly.delayTime.setValueAtTime(delay, ctx.currentTime);
    $("slider").value = delay; $("dval").textContent = f2(delay) + " ث";
  }

  /* ---------- المشغّل: البث ← تأخير ← مكبر الصوت، ومعه نقطة تسجيل للتحليل ---------- */
  async function initCtx() {
    if (ctx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC(); sr = ctx.sampleRate;
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
      tap = new AudioWorkletNode(ctx, "tap", { numberOfInputs: 2, numberOfOutputs: 0, channelCount: 1, channelCountMode: "explicit" });
      tap.port.onmessage = onChunk;
      dly = ctx.createDelay(MAXD); out = ctx.createGain();
      dly.connect(out); out.connect(ctx.destination);
      setDelay(delay); applyGain();
    } catch (e) { ctx = null; throw e; }
  }
  function onChunk(e) {                                           // كل رسالة تحمل الميكروفون والبث معاً بالمحاذاة نفسها
    var b = e.data.b;
    ring.push({ i: total, b: b }); total += b.length;
    while (ring.length > 1 && total - ring[0].i > KEEP * sr) ring.shift();
    if (meas) { if (meas.start === null) meas.start = total - b.length; meas.mic.push(e.data.a); meas.n += b.length; }
  }
  function stopStream() {
    if (el) { el.onerror = null; el.onplaying = null; el.pause(); el.removeAttribute("src"); try { el.load(); } catch (e) {} }
    if (srcNode) { try { srcNode.disconnect(); } catch (e) {} }
    el = null; srcNode = null; playing = false; ring = []; total = 0;
    $("dot").className = "dot"; $("play").textContent = "تشغيل";
  }
  async function play() {
    if (el) { stopStream(); render(); return; }
    try {
      await initCtx(); await ctx.resume();
      var raw = $("url").value.trim();
      if (!raw) return;
      try { $("host").textContent = new URL(raw).hostname; } catch (e) {}
      el = new Audio(); el.crossOrigin = "anonymous";
      el.src = proxyOK ? "/proxy?url=" + encodeURIComponent(raw) : raw;
      el.onplaying = function () { playing = true; $("dot").className = "dot on"; render(); };
      el.onerror = function () {
        stopStream();
        status(proxyOK ? "تعذّر تشغيل البث. تحقق من الرابط."
          : "تعذّر تشغيل البث. غالباً لا يسمح الخادم بقراءة صوته من المتصفح: شغّل proxy_server.py وافتح http://localhost:8000", "bad");
      };
      srcNode = ctx.createMediaElementSource(el);
      srcNode.connect(dly); srcNode.connect(tap, 0, 1);
      $("play").textContent = "إيقاف"; status("جارٍ الاتصال بالبث…", "");
      await el.play();
    } catch (e) {
      if (el === null && ctx) return;                              // رسالة الخطأ ظهرت من onerror
      stopStream(); status("تعذّر التشغيل: " + (e && e.message ? e.message : e), "bad");
    }
  }

  /* ---------- التحليل: نطاقات ترددية ← |الصوت| ← قفزات ← ارتباط متقاطع (FFT) ---------- */
  function band(x, hp, lp) {
    var c = new OfflineAudioContext(1, x.length, sr), b = c.createBuffer(1, x.length, sr);
    b.getChannelData(0).set(x);
    var s = c.createBufferSource(); s.buffer = b;
    var n = s;
    [["highpass", hp], ["lowpass", lp]].forEach(function (p) {
      var q = c.createBiquadFilter(); q.type = p[0]; q.frequency.value = p[1]; q.Q.value = 0.7071; n.connect(q); n = q;
    });
    n.connect(c.destination); s.start();
    return c.startRendering().then(function (o) { return o.getChannelData(0); });
  }
  function envelope(x, down) {
    var n = Math.floor(x.length / down), e = new Float32Array(n);
    for (var i = 0; i < n; i++) { var s = 0; for (var j = i * down, k = j + down; j < k; j++) s += Math.abs(x[j]); e[i] = s / down; }
    return e;
  }
  function spike(e, rate) {                                       // الشدة فوق متوسطها خلال ثانيتين فقط
    var n = e.length, h = Math.max(1, Math.round(rate)), cs = new Float64Array(n + 1), f = new Float64Array(n), i, sum = 0;
    for (i = 0; i < n; i++) cs[i + 1] = cs[i] + e[i];
    for (i = 0; i < n; i++) {
      var a = Math.max(0, i - h), b = Math.min(n, i + h + 1), v = e[i] - (cs[b] - cs[a]) / (b - a);
      f[i] = v > 0 ? v : 0; sum += f[i];
    }
    var mu = sum / n, ss = 0;
    for (i = 0; i < n; i++) { f[i] -= mu; ss += f[i] * f[i]; }
    var sd = Math.sqrt(ss / n);
    if (!(sd > 1e-9)) return null;
    for (i = 0; i < n; i++) f[i] /= sd;
    return f;
  }
  function fft(re, im, inv) {
    var n = re.length, i, j, bit, t;
    for (i = 1, j = 0; i < n; i++) {
      bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
    }
    for (var len = 2; len <= n; len <<= 1) {
      var ang = (inv ? 2 : -2) * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang), half = len >> 1;
      for (i = 0; i < n; i += len) {
        var cr = 1, ci = 0;
        for (var k = 0; k < half; k++) {
          var p = i + k, q = p + half, xr = re[q] * cr - im[q] * ci, xi = re[q] * ci + im[q] * cr;
          re[q] = re[p] - xr; im[q] = im[p] - xi; re[p] += xr; im[p] += xi;
          t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
    if (inv) for (i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
  }
  function xcorr(pairs) {                                         // c[k] = Σ a[n+k]·b[n] مجموعاً على النطاقات
    var na = pairs[0][0].length, nb = pairs[0][1].length, N = 1;
    while (N < na + nb) N <<= 1;
    var pr = new Float64Array(N), pi = new Float64Array(N);
    pairs.forEach(function (p) {
      var ar = new Float64Array(N), ai = new Float64Array(N), br = new Float64Array(N), bi = new Float64Array(N);
      ar.set(p[0]); br.set(p[1]); fft(ar, ai, false); fft(br, bi, false);
      for (var k = 0; k < N; k++) { pr[k] += ar[k] * br[k] + ai[k] * bi[k]; pi[k] += ai[k] * br[k] - ar[k] * bi[k]; }
    });
    fft(pr, pi, true);
    return pr;
  }
  function analyze(pairs, rate, pre, minOv) {                     // A = الميكروفون، B = مقطع البث الذي يبدأ قبل الميكروفون بـ pre ثانية
    var na = pairs[0][0].length, nb = pairs[0][1].length, c = xcorr(pairs), N = c.length;
    var minS = Math.max(1, Math.floor(minOv * rate)), lags = [], sc = [], lag, ov, i;
    for (lag = -(nb - 1); lag <= na - 1; lag++) {
      ov = Math.min(na, nb + lag) - Math.max(0, lag);
      if (ov < minS) continue;
      lags.push(lag); sc.push(c[lag >= 0 ? lag : N + lag] / Math.sqrt(ov));
    }
    if (sc.length < 50) return null;
    var k = 0;
    for (i = 1; i < sc.length; i++) if (sc[i] > sc[k]) k = i;
    var sorted = Float64Array.from(sc).sort(), med = sorted[sorted.length >> 1];
    var dev = Float64Array.from(sc, function (v) { return Math.abs(v - med); }).sort();
    var spread = Math.max(dev[dev.length >> 1] * 1.4826, 1e-9), z = (sc[k] - med) / spread;
    var g = Math.round(1.5 * rate), r2 = -Infinity;
    for (i = 0; i < sc.length; i++) if (Math.abs(i - k) > g && sc[i] > r2) r2 = sc[i];
    var z2 = r2 === -Infinity ? 0 : (r2 - med) / spread;
    var q = (z >= 9 && z2 <= 0.5 * z) ? "HIGH" : (z >= 6 && z2 <= 0.65 * z) ? "MEDIUM" : "LOW";
    return { delay: -lags[k] / rate - pre, z: z, z2: z2, q: q };  // موجب = البث العربي متأخر عن التلفاز
  }
  async function analyzeAll(mic, str, pre) {
    var down = Math.max(1, Math.round(sr / 320)), rate = sr / down, pairs = [];
    for (var b = 0; b < BANDS.length; b++) {
      var fa = spike(envelope(await band(mic, BANDS[b][0], BANDS[b][1]), down), rate);
      var fb = spike(envelope(await band(str, BANDS[b][0], BANDS[b][1]), down), rate);
      if (fa && fb) pairs.push([fa, fb]);
    }
    return pairs.length ? analyze(pairs, rate, pre, Math.min(MINOV, 0.4 * mic.length / sr)) : null;
  }
  function slice(from, to) {
    var o = new Float32Array(Math.max(0, to - from));
    for (var i = 0; i < ring.length; i++) {
      var c = ring[i], s = c.i, e = s + c.b.length;
      if (e <= from || s >= to) continue;
      var a = Math.max(from, s), z = Math.min(to, e);
      o.set(c.b.subarray(a - s, z - s), a - from);
    }
    return o;
  }
  function rms(x) { var s = 0, n = 0; for (var i = 0; i < x.length; i += 7) { s += x[i] * x[i]; n++; } return n ? Math.sqrt(s / n) : 0; }

  /* ---------- الخطوة 1: فحص فقط، دون تغيير أي شيء في التشغيل ---------- */
  async function measure() {
    if (busy) return;
    if (!playing) { status("شغّل البث أولاً ثم أعد الفحص.", "bad"); return; }
    var dur = +$("dur").value, mic = null, ms = null, err = null;
    busy = true; applyGain(); $("mbtn").disabled = true; $("sync").disabled = true;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("secure");
      mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
      ms = ctx.createMediaStreamSource(mic); ms.connect(tap, 0, 0);
      var need = Math.round(dur * sr), t0 = performance.now();
      meas = { start: null, mic: [], n: 0 };
      status("جارٍ الفحص… ضع الهاتف قرب التلفاز", "");
      await new Promise(function (resolve, reject) {
        var iv = setInterval(function () {
          var sec = (performance.now() - t0) / 1000;
          progress(Math.min(1, meas.n / need), "جارٍ الفحص… " + Math.max(0, Math.ceil(dur - meas.n / sr)));
          if (meas.n === 0 && sec > 8) { clearInterval(iv); reject(new Error("mic")); }
          else if (meas.n >= need || sec > dur + 12) { clearInterval(iv); resolve(); }
        }, 200);
      });
      var m = meas; meas = null;
      mic.getTracks().forEach(function (t) { t.stop(); }); ms.disconnect();
      progress(1, "جارٍ التحليل…"); status("جارٍ التحليل…", "");
      await new Promise(function (r) { setTimeout(r, 30); });
      var n = Math.min(m.n, need), micArr = new Float32Array(n), o = 0;
      for (var i = 0; i < m.mic.length && o < n; i++) {
        var c = m.mic[i], len = Math.min(c.length, n - o);
        micArr.set(c.subarray(0, len), o); o += len;
      }
      var from = Math.max(ring.length ? ring[0].i : 0, m.start - PRE * sr), pre = (m.start - from) / sr;
      var str = slice(from, m.start + n);
      if (rms(micArr) < 1e-5) throw new Error("silentmic");
      if (rms(str) < 1e-5) throw new Error("silentstream");
      var r = await analyzeAll(micArr, str, pre);
      if (!r) throw new Error("short");
      measured = { D: r.delay, q: r.q, z: r.z, z2: r.z2 }; mode = "measured";
    } catch (e) {
      meas = null;
      err = {
        secure: "الميكروفون يتطلب فتح الصفحة عبر http://localhost:8000 (شغّل proxy_server.py).",
        mic: "لا يصل صوت من الميكروفون. اسمح باستخدامه وأعد المحاولة.",
        silentmic: "الميكروفون صامت. قرّب الهاتف من التلفاز وارفع صوته.",
        silentstream: "لا يصل صوت البث إلى المحلل (قيود CORS). شغّل proxy_server.py وافتح http://localhost:8000",
        short: "لا يكفي الصوت للمقارنة. جرّب مدة أطول."
      }[e && e.message] || ("تعذّر الفحص: " + (e && e.name === "NotAllowedError" ? "رُفض إذن الميكروفون" : (e && e.message ? e.message : e)));
    } finally {
      try { if (mic) mic.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      busy = false; applyGain(); progress(0, "فحص التأخير"); $("mbtn").disabled = false;
      render(); if (err) status(err, "bad");
    }
  }

  /* ---------- الخطوة 2: القرار بيد المستخدم ---------- */
  $("play").onclick = play;
  $("mbtn").onclick = measure;
  $("sync").onclick = function () {
    if (!measured) return;
    setDelay(measured.D < -0.05 ? -measured.D : 0);               // الراديو متقدم: يُؤخَّر. التلفاز متقدم: تعليمة للرسيفر فقط
    mode = "synced"; render();
  };
  $("mute").onclick = function () {
    muted = !muted; $("mute").setAttribute("aria-pressed", String(muted));
    $("mute").textContent = (muted ? "🔇" : "🔊") + " صوت القناة"; applyGain();
  };
  $("stopsync").onclick = function () { setDelay(0); measured = null; mode = "idle"; render(); };
  $("slider").oninput = function () { setDelay(+this.value); mode = "manual"; render(); };
  Array.prototype.forEach.call(document.querySelectorAll(".btns button"), function (b) {
    b.onclick = function () { setDelay(delay + (+b.dataset.d)); mode = "manual"; render(); };
  });

  fetch("/ping").then(function (r) { return r.text(); }).then(function (t) { proxyOK = t === "ok"; }).catch(function () {}).then(function () {
    if (!proxyOK) $("hint").textContent = "تنبيه: الصفحة تعمل دون الوسيط المحلي، وقد يمنع المتصفح قراءة صوت البث أو الميكروفون. شغّل proxy_server.py وافتح http://localhost:8000";
  });
  setDelay(0); render();
})();
</script>
</body>
</html>
