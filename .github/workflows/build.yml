name: Build HTML to APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate WebView Android Project
        run: |
          mkdir -p app/src/main/java/com/sync/webapp
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FootballSyncWeb"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.sync.webapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sync.webapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <application
                  android:label="مزامن الصوتيات"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/sync/webapp/MainActivity.kt
          package com.sync.webapp

          import android.Manifest
          import android.app.Activity
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Bundle
          import android.webkit.*
          import java.io.ByteArrayInputStream
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : Activity() {
              private lateinit var webView: WebView

              @Suppress("DEPRECATION")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0B1120")

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                  }

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#0B1120"))
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.allowFileAccess = true
                      settings.allowContentAccess = true
                      settings.allowFileAccessFromFileURLs = true
                      settings.allowUniversalAccessFromFileURLs = true
                      settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW

                      webViewClient = object : WebViewClient() {
                          override fun shouldInterceptRequest(
                              view: WebView?,
                              request: WebResourceRequest?
                          ): WebResourceResponse? {
                              val urlStr = request?.url?.toString() ?: return super.shouldInterceptRequest(view, request)
                              if (urlStr.startsWith("http://") || urlStr.startsWith("https://")) {
                                  try {
                                      val headers = HashMap<String, String>()
                                      headers["Access-Control-Allow-Origin"] = "*"
                                      headers["Access-Control-Allow-Methods"] = "GET, POST, OPTIONS"
                                      headers["Access-Control-Allow-Headers"] = "*"

                                      if (request.method.equals("OPTIONS", ignoreCase = true)) {
                                          return WebResourceResponse("text/plain", "UTF-8", 200, "OK", headers, ByteArrayInputStream(ByteArray(0)))
                                      }

                                      val conn = URL(urlStr).openConnection() as HttpURLConnection
                                      conn.requestMethod = request.method
                                      conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                                      conn.instanceFollowRedirects = true
                                      conn.connectTimeout = 10000
                                      conn.readTimeout = 15000
                                      conn.connect()

                                      val rawType = conn.contentType ?: "audio/mpeg"
                                      val mime = rawType.split(";")[0].trim()
                                      val status = if (conn.responseCode in 200..299) conn.responseCode else 200
                                      return WebResourceResponse(mime, null, status, "OK", headers, conn.inputStream)
                                  } catch (e: Exception) {
                                      return super.shouldInterceptRequest(view, request)
                                  }
                              }
                              return super.shouldInterceptRequest(view, request)
                          }
                      }

                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest) {
                              runOnUiThread {
                                  request.grant(request.resources)
                              }
                          }
                      }
                  }

                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/index.html")
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MySyncApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
