name: Build HTML to APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate WebView Android Project
        run: |
          mkdir -p app/src/main/java/com/sync/webapp
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FootballSyncWeb"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.sync.webapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sync.webapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <application
                  android:label="مزامن الصوتيات"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/sync/webapp/MainActivity.kt
          package com.sync.webapp

          import android.Manifest
          import android.app.Activity
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Bundle
          import android.webkit.*
          import java.io.*
          import java.net.*

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var serverSocket: ServerSocket? = null
              @Volatile private var running = true
              private val port = 8765

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0B1120")

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                  }

                  startLocalServer()

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#0B1120"))
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW

                      webViewClient = WebViewClient()
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest) {
                              runOnUiThread { request.grant(request.resources) }
                          }
                      }
                  }

                  setContentView(webView)
                  webView.loadUrl("http://127.0.0.1:$port/")
              }

              private fun startLocalServer() {
                  Thread {
                      try {
                          serverSocket = ServerSocket(port, 50, InetAddress.getByName("127.0.0.1"))
                          while (running) {
                              val client = serverSocket?.accept() ?: break
                              Thread { handleClient(client) }.start()
                          }
                      } catch (_: Exception) {}
                  }.start()
              }

              private fun handleClient(client: Socket) {
                  try {
                      val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                      val requestLine = reader.readLine() ?: return
                      val parts = requestLine.split(" ")
                      if (parts.size < 2) return
                      val method = parts[0]
                      val path = parts[1]

                      while (true) {
                          val line = reader.readLine()
                          if (line.isNullOrEmpty()) break
                      }

                      val out = client.getOutputStream()

                      if (method == "OPTIONS") {
                          val resp = "HTTP/1.1 200 OK\r\nAccess-Control-Allow-Origin: *\r\nAccess-Control-Allow-Methods: GET, POST, OPTIONS\r\nAccess-Control-Allow-Headers: *\r\nContent-Length: 0\r\n\r\n"
                          out.write(resp.toByteArray())
                          out.flush()
                          return
                      }

                      if (path.startsWith("/proxy?url=")) {
                          val targetUrl = URLDecoder.decode(path.substringAfter("/proxy?url="), "UTF-8")
                          streamWithRawSocket(targetUrl, out, 0)
                      } else {
                          var html = assets.open("index.html").bufferedReader().use { it.readText() }
                          val inject = """
                              <script>
                              (function(){
                                const P = "http://127.0.0.1:$port/proxy?url=";
                                const wrap = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) && !u.startsWith("http://127.0.0.1")) ? P + encodeURIComponent(u) : u;
                                const OrigAudio = window.Audio;
                                window.Audio = function(src) { return new OrigAudio(src ? wrap(src) : undefined); };
                                const desc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "src");
                                if (desc && desc.set) {
                                  Object.defineProperty(HTMLMediaElement.prototype, "src", {
                                    get: function() { return desc.get.call(this); },
                                    set: function(v) { desc.set.call(this, wrap(v)); }
                                  });
                                }
                                const origSetAttr = Element.prototype.setAttribute;
                                Element.prototype.setAttribute = function(k, v) {
                                  if (k.toLowerCase() === "src" && (this.tagName === "AUDIO" || this.tagName === "SOURCE")) v = wrap(v);
                                  return origSetAttr.call(this, k, v);
                                };
                                const origFetch = window.fetch;
                                window.fetch = function(input, init) {
                                  if (typeof input === "string") input = wrap(input);
                                  return origFetch.call(this, input, init);
                                };
                              })();
                              </script>
                          """.trimIndent()
                          html = if (html.contains("<head>", ignoreCase = true)) {
                              html.replaceFirst(Regex("<head>", RegexOption.IGNORE_CASE), "<head>\n$inject")
                          } else {
                              inject + "\n" + html
                          }
                          val bytes = html.toByteArray(Charsets.UTF_8)
                          val header = "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: ${bytes.size}\r\nConnection: close\r\n\r\n"
                          out.write(header.toByteArray())
                          out.write(bytes)
                          out.flush()
                      }
                  } catch (_: Exception) {
                  } finally {
                      try { client.close() } catch (_: Exception) {}
                  }
              }

              private fun streamWithRawSocket(urlStr: String, out: OutputStream, depth: Int) {
                  if (depth > 3) return
                  val u = URL(urlStr)
                  val host = u.host
                  val targetPort = if (u.port != -1) u.port else if (u.protocol == "https") 443 else 80
                  val reqPath = (if (u.path.isNullOrEmpty()) "/" else u.path) + (if (u.query != null) "?${u.query}" else "")

                  val remote: Socket = if (u.protocol == "https") {
                      javax.net.ssl.SSLSocketFactory.getDefault().createSocket(host, targetPort)
                  } else {
                      Socket().apply { connect(InetSocketAddress(host, targetPort), 10000) }
                  }
                  remote.soTimeout = 20000

                  try {
                      val req = "GET $reqPath HTTP/1.0\r\nHost: $host:$targetPort\r\nUser-Agent: VLC/3.0.18\r\nIcy-MetaData: 0\r\nAccept: */*\r\nConnection: close\r\n\r\n"
                      remote.getOutputStream().write(req.toByteArray())
                      remote.getOutputStream().flush()

                      val inp = BufferedInputStream(remote.getInputStream())
                      var contentType = "audio/mpeg"
                      var redirectUrl: String? = null
                      val lineBuf = ByteArrayOutputStream()

                      // Read headers line by line until empty line
                      while (true) {
                          lineBuf.reset()
                          var prev = -1
                          while (true) {
                              val b = inp.read()
                              if (b == -1) return
                              if (b == '\n'.code) break
                              if (b != '\r'.code) lineBuf.write(b)
                              prev = b
                          }
                          val line = lineBuf.toString("UTF-8").trim()
                          if (line.isEmpty()) break
                          if (line.startsWith("Content-Type:", ignoreCase = true)) {
                              contentType = line.substringAfter(":").trim().split(";")[0]
                          } else if (line.startsWith("Location:", ignoreCase = true)) {
                              redirectUrl = line.substringAfter(":").trim()
                          }
                      }

                      if (redirectUrl != null) {
                          remote.close()
                          streamWithRawSocket(redirectUrl, out, depth + 1)
                          return
                      }

                      val respHeader = "HTTP/1.1 200 OK\r\nContent-Type: $contentType\r\nAccess-Control-Allow-Origin: *\r\nCache-Control: no-cache\r\nConnection: close\r\n\r\n"
                      out.write(respHeader.toByteArray())
                      out.flush()

                      val buf = ByteArray(8192)
                      while (running) {
                          val n = inp.read(buf)
                          if (n == -1) break
                          out.write(buf, 0, n)
                          out.flush()
                      }
                  } finally {
                      try { remote.close() } catch (_: Exception) {}
                  }
              }

              override fun onDestroy() {
                  running = false
                  try { serverSocket?.close() } catch (_: Exception) {}
                  super.onDestroy()
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MySyncApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
