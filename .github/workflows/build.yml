name: Build HTML to APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate WebView Android Project
        run: |
          mkdir -p app/src/main/java/com/sync/webapp
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FootballSyncWeb"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.sync.webapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sync.webapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <application
                  android:label="مزامن الصوتيات"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/sync/webapp/MainActivity.kt
          package com.sync.webapp

          import android.Manifest
          import android.app.Activity
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Bundle
          import android.webkit.*
          import java.io.*
          import java.net.*

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var serverSocket: ServerSocket? = null
              @Volatile private var running = true
              private val port = 8765

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0B1120")

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                  }

                  startLocalServer()

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#0B1120"))
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW

                      webViewClient = WebViewClient()
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest) {
                              runOnUiThread { request.grant(request.resources) }
                          }
                      }
                  }

                  setContentView(webView)
                  webView.loadUrl("http://127.0.0.1:$port/")
              }

              private fun startLocalServer() {
                  Thread {
                      try {
                          serverSocket = ServerSocket(port, 50, InetAddress.getByName("127.0.0.1"))
                          while (running) {
                              val client = serverSocket?.accept() ?: break
                              Thread { handleClient(client) }.start()
                          }
                      } catch (_: Exception) {}
                  }.start()
              }

              private fun handleClient(client: Socket) {
                  try {
                      val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                      val requestLine = reader.readLine() ?: return
                      val parts = requestLine.split(" ")
                      if (parts.size < 2) return
                      val method = parts[0]
                      val path = parts[1]

                      // Consume remaining headers
                      while (true) {
                          val line = reader.readLine()
                          if (line.isNullOrEmpty()) break
                      }

                      val out = client.getOutputStream()

                      if (method == "OPTIONS") {
                          val resp = "HTTP/1.1 200 OK\r\n" +
                              "Access-Control-Allow-Origin: *\r\n" +
                              "Access-Control-Allow-Methods: GET, POST, OPTIONS\r\n" +
                              "Access-Control-Allow-Headers: *\r\n" +
                              "Content-Length: 0\r\n\r\n"
                          out.write(resp.toByteArray())
                          out.flush()
                          return
                      }

                      if (path.startsWith("/proxy?url=")) {
                          val encodedUrl = path.substringAfter("/proxy?url=")
                          val targetUrl = URLDecoder.decode(encodedUrl, "UTF-8")
                          val conn = URL(targetUrl).openConnection() as HttpURLConnection
                          conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 12)")
                          conn.setRequestProperty("Accept", "*/*")
                          conn.instanceFollowRedirects = true
                          conn.connectTimeout = 10000
                          conn.readTimeout = 20000
                          conn.connect()

                          val contentType = conn.contentType ?: "audio/mpeg"
                          val header = "HTTP/1.1 200 OK\r\n" +
                              "Content-Type: $contentType\r\n" +
                              "Access-Control-Allow-Origin: *\r\n" +
                              "Cache-Control: no-cache\r\n" +
                              "Connection: close\r\n\r\n"
                          out.write(header.toByteArray())
                          out.flush()

                          val input = conn.inputStream
                          val buf = ByteArray(8192)
                          while (running) {
                              val n = input.read(buf)
                              if (n == -1) break
                              out.write(buf, 0, n)
                              out.flush()
                          }
                          input.close()
                          conn.disconnect()
                      } else {
                          var html = assets.open("index.html").bufferedReader().use { it.readText() }
                          val inject = """
                              <script>
                              (function(){
                                const P = "http://127.0.0.1:$port/proxy?url=";
                                const wrap = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) && !u.startsWith("http://127.0.0.1")) ? P + encodeURIComponent(u) : u;
                                const desc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "src");
                                if (desc && desc.set) {
                                  Object.defineProperty(HTMLMediaElement.prototype, "src", {
                                    get: function() { return desc.get.call(this); },
                                    set: function(v) { desc.set.call(this, wrap(v)); }
                                  });
                                }
                                const origFetch = window.fetch;
                                window.fetch = function(input, init) {
                                  if (typeof input === "string") input = wrap(input);
                                  return origFetch.call(this, input, init);
                                };
                              })();
                              </script>
                          """.trimIndent()
                          html = if (html.contains("<head>", ignoreCase = true)) {
                              html.replaceFirst(Regex("<head>", RegexOption.IGNORE_CASE), "<head>\n$inject")
                          } else {
                              inject + "\n" + html
                          }
                          val bytes = html.toByteArray(Charsets.UTF_8)
                          val header = "HTTP/1.1 200 OK\r\n" +
                              "Content-Type: text/html; charset=utf-8\r\n" +
                              "Content-Length: ${bytes.size}\r\n" +
                              "Connection: close\r\n\r\n"
                          out.write(header.toByteArray())
                          out.write(bytes)
                          out.flush()
                      }
                  } catch (_: Exception) {
                  } finally {
                      try { client.close() } catch (_: Exception) {}
                  }
              }

              override fun onDestroy() {
                  running = false
                  try { serverSocket?.close() } catch (_: Exception) {}
                  super.onDestroy()
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MySyncApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
