name: Build HTML to APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Generate Direct PCM ExoPlayer Bridge
        run: |
          mkdir -p app/src/main/java/com/sync/webapp
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FootballSyncWeb"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.sync.webapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sync.webapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
              implementation 'androidx.media3:media3-common:1.4.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="[http://schemas.android.com/apk/res/android](http://schemas.android.com/apk/res/android)">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <application
                  android:label="مزامن المعلق"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/sync/webapp/MainActivity.kt
          package com.sync.webapp

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.webkit.*
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.audio.AudioSink
          import androidx.media3.exoplayer.audio.DefaultAudioSink
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import java.io.*
          import java.net.*
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.LinkedBlockingQueue
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicInteger
          import java.util.concurrent.atomic.AtomicLong
          import java.util.concurrent.atomic.AtomicReference
          import javax.net.ssl.SSLSocketFactory

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var serverSocket: ServerSocket? = null
              @Volatile private var running = true
              private val port = 8765
              private val mainHandler = Handler(Looper.getMainLooper())

              private val sessionCounter = AtomicLong(0)
              @Volatile private var activeSessionId = 0L
              private var activePlayer: ExoPlayer? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#050811")

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                  }

                  startLocalServer()

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#050811"))
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW

                      webViewClient = WebViewClient()
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest) {
                              runOnUiThread { request.grant(request.resources) }
                          }
                      }
                  }

                  setContentView(webView)
                  webView.loadUrl("[http://127.0.0.1](http://127.0.0.1):$port/")
              }

              private fun startLocalServer() {
                  Thread {
                      try {
                          serverSocket = ServerSocket(port, 50, InetAddress.getByName("127.0.0.1"))
                          while (running) {
                              val client = serverSocket?.accept() ?: break
                              Thread { handleClient(client) }.start()
                          }
                      } catch (_: Exception) {}
                  }.start()
              }

              private fun handleClient(client: Socket) {
                  try {
                      val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                      val requestLine = reader.readLine() ?: return
                      val parts = requestLine.split(" ")
                      if (parts.size < 2) return
                      val method = parts[0]
                      val path = parts[1]

                      while (true) {
                          val line = reader.readLine()
                          if (line.isNullOrEmpty()) break
                      }

                      val out = client.getOutputStream()

                      if (method == "OPTIONS") {
                          val resp = "HTTP/1.1 200 OK\r\nAccess-Control-Allow-Origin: *\r\nAccess-Control-Allow-Methods: GET, HEAD, OPTIONS\r\nAccess-Control-Allow-Headers: *\r\nContent-Length: 0\r\n\r\n"
                          out.write(resp.toByteArray())
                          out.flush()
                          return
                      }

                      if (path.startsWith("/stop")) {
                          activeSessionId = sessionCounter.incrementAndGet()
                          mainHandler.post { releaseActivePlayer() }
                          val resp = "HTTP/1.1 200 OK\r\nContent-Length: 0\r\nConnection: close\r\n\r\n"
                          out.write(resp.toByteArray())
                          out.flush()
                          return
                      }

                      if (path.startsWith("/raw?")) {
                          val query = path.substringAfter("/raw?")
                          val rawUrl = query.split("&").firstOrNull { it.startsWith("url=") }?.substringAfter("url=") ?: return
                          val targetUrl = URLDecoder.decode(rawUrl, "UTF-8")
                          streamWithRawSocket(targetUrl, out, 0)
                          return
                      }

                      if (path.startsWith("/pcm?")) {
                          val query = path.substringAfter("/pcm?")
                          val rawUrl = query.split("&").firstOrNull { it.startsWith("url=") }?.substringAfter("url=") ?: return
                          val targetUrl = URLDecoder.decode(rawUrl, "UTF-8")
                          streamViaExoPlayer(targetUrl, out)
                          return
                      }

                      var html = assets.open("index.html").bufferedReader().use { it.readText() }.trim()
                      if (html.startsWith("```")) {
                          html = html.substringAfter("\n")
                      }
                      if (html.endsWith("```")) {
                          html = html.substringBeforeLast("```")
                      }

                      val inject = """
                          <script>
                          (function(){
                            const BASE = "http://127.0.0.1:$port";
                            let bridgeCtx = null;
                            let bridgeGain = null;
                            let realSrc = "";
                            let abortCtrl = null;
                            let activeNodes = [];

                            const AC = window.AudioContext || window.webkitAudioContext;
                            if (AC) {
                              const origCreateMES = AC.prototype.createMediaElementSource;
                              AC.prototype.createMediaElementSource = function(el) {
                                if (el && el.id === "radioAudio") {
                                  bridgeCtx = this;
                                  bridgeGain = this.createGain();
                                  return bridgeGain;
                                }
                                return origCreateMES.call(this, el);
                              };
                            }

                            function stopBridge() {
                              if (abortCtrl) {
                                try { abortCtrl.abort(); } catch(e) {}
                                abortCtrl = null;
                              }
                              activeNodes.forEach(function(n) { try { n.stop(); n.disconnect(); } catch(e) {} });
                              activeNodes = [];
                              fetch(BASE + "/stop").catch(function(){});
                            }

                            window.addEventListener("DOMContentLoaded", function() {
                              const audioEl = document.getElementById("radioAudio");
                              if (!audioEl) return;

                              Object.defineProperty(audioEl, "src", {
                                get: function() { return realSrc; },
                                set: function(v) { realSrc = v || ""; }
                              });

                              audioEl.removeAttribute = function(k) {
                                if (k === "src") realSrc = "";
                              };
                              audioEl.load = function() {};
                              audioEl.pause = function() { stopBridge(); };

                              audioEl.play = async function() {
                                stopBridge();
                                if (!realSrc) throw new Error("لا يوجد رابط بث");
                                abortCtrl = new AbortController();
                                const ctrl = abortCtrl;
                                const resp = await fetch(BASE + "/pcm?url=" + encodeURIComponent(realSrc) + "&_t=" + Date.now(), {
                                  signal: ctrl.signal
                                });
                                if (!resp.ok) {
                                  const errText = await resp.text().catch(function(){ return "HTTP " + resp.status; });
                                  setTimeout(function() {
                                    const noticeEl = document.getElementById("streamNoticeText");
                                    if (noticeEl) noticeEl.textContent = "سبب الفشل: " + errText + " — الرابط: " + realSrc;
                                  }, 100);
                                  throw new Error(errText);
                                }
                                const sr = parseInt(resp.headers.get("X-Sample-Rate") || "44100", 10);
                                const ch = parseInt(resp.headers.get("X-Channels") || "2", 10);
                                const frameBytes = ch * 2;
                                const minBytes = Math.floor(sr * 0.12) * frameBytes;
                                const reader = resp.body.getReader();

                                (async function pump() {
                                  let leftover = new Uint8Array(0);
                                  let nextTime = 0;
                                  try {
                                    while (!ctrl.signal.aborted) {
                                      const res = await reader.read();
                                      if (res.done) break;
                                      const chunk = res.value;
                                      const merged = new Uint8Array(leftover.length + chunk.length);
                                      merged.set(leftover, 0);
                                      merged.set(chunk, leftover.length);
                                      if (merged.length < minBytes) {
                                        leftover = merged;
                                        continue;
                                      }
                                      const usable = merged.length - (merged.length % frameBytes);
                                      leftover = merged.slice(usable);
                                      if (!bridgeCtx || !bridgeGain) continue;

                                      const frames = usable / frameBytes;
                                      const abuf = bridgeCtx.createBuffer(ch, frames, sr);
                                      const dv = new DataView(merged.buffer, merged.byteOffset, usable);
                                      const chArrays = [];
                                      for (let c = 0; c < ch; c++) chArrays.push(abuf.getChannelData(c));
                                      let off = 0;
                                      for (let i = 0; i < frames; i++) {
                                        for (let c = 0; c < ch; c++) {
                                          chArrays[c][i] = dv.getInt16(off, true) / 32768.0;
                                          off += 2;
                                        }
                                      }

                                      const srcNode = bridgeCtx.createBufferSource();
                                      srcNode.buffer = abuf;
                                      srcNode.connect(bridgeGain);
                                      const now = bridgeCtx.currentTime;
                                      if (nextTime < now + 0.02 || nextTime > now + 1.5) {
                                        nextTime = now + 0.15;
                                      }
                                      srcNode.start(nextTime);
                                      nextTime += abuf.duration;
                                      activeNodes.push(srcNode);
                                      srcNode.onended = function() {
                                        const idx = activeNodes.indexOf(srcNode);
                                        if (idx >= 0) activeNodes.splice(idx, 1);
                                      };
                                    }
                                  } catch (e) {}
                                })();
                              };
                            });
                          })();
                          </script>
                      """.trimIndent()

                      html = if (html.contains("<head>", ignoreCase = true)) {
                          html.replaceFirst(Regex("<head>", RegexOption.IGNORE_CASE), "<head>\n$inject")
                      } else {
                          inject + "\n" + html
                      }
                      val bytes = html.toByteArray(Charsets.UTF_8)
                      val header = "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: ${bytes.size}\r\nConnection: close\r\n\r\n"
                      out.write(header.toByteArray())
                      out.write(bytes)
                      out.flush()
                  } catch (_: Exception) {
                  } finally {
                      try { client.close() } catch (_: Exception) {}
                  }
              }

              private fun streamWithRawSocket(urlStr: String, out: OutputStream, depth: Int) {
                  if (depth > 4) return
                  val u = URL(urlStr)
                  val host = u.host
                  val targetPort = if (u.port != -1) u.port else if (u.protocol == "https") 443 else 80
                  val hostHeader = if ((u.protocol == "http" && targetPort == 80) || (u.protocol == "https" && targetPort == 443)) host else "$host:$targetPort"
                  val reqPath = (if (u.path.isNullOrEmpty()) "/" else u.path) + (if (u.query != null) "?${u.query}" else "")

                  val remote: Socket = if (u.protocol == "https") {
                      SSLSocketFactory.getDefault().createSocket(host, targetPort)
                  } else {
                      Socket().apply { connect(InetSocketAddress(host, targetPort), 10000) }
                  }
                  remote.soTimeout = 20000

                  try {
                      val req = "GET $reqPath HTTP/1.0\r\nHost: $hostHeader\r\nUser-Agent: VLC/3.0.18\r\nIcy-MetaData: 0\r\nAccept: */*\r\nConnection: close\r\n\r\n"
                      remote.getOutputStream().write(req.toByteArray())
                      remote.getOutputStream().flush()

                      val inp = BufferedInputStream(remote.getInputStream())
                      val lineBuf = ByteArrayOutputStream()

                      fun readHeaderLine(): String? {
                          lineBuf.reset()
                          while (true) {
                              val b = inp.read()
                              if (b == -1) return if (lineBuf.size() == 0) null else lineBuf.toString("UTF-8").trim()
                              if (b == '\n'.code) break
                              if (b != '\r'.code) lineBuf.write(b)
                          }
                          return lineBuf.toString("UTF-8").trim()
                      }

                      val statusLine = readHeaderLine() ?: return
                      val statusCode = statusLine.split(" ").getOrNull(1)?.toIntOrNull() ?: 200
                      var contentType = "audio/mpeg"
                      var redirectUrl: String? = null

                      while (true) {
                          val line = readHeaderLine() ?: break
                          if (line.isEmpty()) break
                          if (line.startsWith("Content-Type:", ignoreCase = true)) {
                              contentType = line.substringAfter(":").trim().split(";")[0]
                          } else if (line.startsWith("Location:", ignoreCase = true)) {
                              redirectUrl = line.substringAfter(":").trim()
                          }
                      }

                      if (statusCode in 300..399 && redirectUrl != null) {
                          val nextUrl = URL(u, redirectUrl).toString()
                          remote.close()
                          streamWithRawSocket(nextUrl, out, depth + 1)
                          return
                      }

                      if (statusCode !in 200..299) {
                          val errResp = "HTTP/1.1 $statusCode Error\r\nContent-Length: 0\r\nConnection: close\r\n\r\n"
                          out.write(errResp.toByteArray())
                          out.flush()
                          return
                      }

                      val respHeader = "HTTP/1.1 200 OK\r\nContent-Type: $contentType\r\nConnection: close\r\n\r\n"
                      out.write(respHeader.toByteArray())
                      out.flush()

                      val buf = ByteArray(8192)
                      while (running) {
                          val n = inp.read(buf)
                          if (n == -1) break
                          out.write(buf, 0, n)
                          out.flush()
                      }
                  } finally {
                      try { remote.close() } catch (_: Exception) {}
                  }
              }

              private fun releaseActivePlayer() {
                  try {
                      activePlayer?.stop()
                      activePlayer?.release()
                  } catch (_: Exception) {}
                  activePlayer = null
              }

              private fun streamViaExoPlayer(targetUrl: String, out: OutputStream) {
                  val mySession = sessionCounter.incrementAndGet()
                  activeSessionId = mySession

                  val queue = LinkedBlockingQueue<ByteArray>(200)
                  val formatLatch = CountDownLatch(1)
                  val sampleRate = AtomicInteger(44100)
                  val channels = AtomicInteger(2)
                  val errorMsg = AtomicReference<String?>(null)

                  val tapProcessor = TapAudioProcessor(
                      onFormatReady = { sr, ch ->
                          if (sr > 0 && ch > 0) {
                              sampleRate.set(sr)
                              channels.set(ch)
                              formatLatch.countDown()
                          }
                      },
                      onPcmData = { pcm ->
                          if (activeSessionId == mySession) {
                              if (!queue.offer(pcm)) {
                                  queue.poll()
                                  queue.offer(pcm)
                              }
                          }
                      }
                  )

                  val playbackUrl = if (targetUrl.contains(".m3u8", ignoreCase = true)) {
                      targetUrl
                  } else {
                      "http://127.0.0.1:$port/raw?url=" + URLEncoder.encode(targetUrl, "UTF-8")
                  }

                  mainHandler.post {
                      if (activeSessionId != mySession) return@post
                      releaseActivePlayer()
                      try {
                          val httpFactory = DefaultHttpDataSource.Factory()
                              .setUserAgent("VLC/3.0.18")
                              .setAllowCrossProtocolRedirects(true)
                              .setConnectTimeoutMs(12000)
                              .setReadTimeoutMs(15000)

                          val renderersFactory = object : DefaultRenderersFactory(this) {
                              override fun buildAudioSink(
                                  context: Context,
                                  enableFloatOutput: Boolean,
                                  enableAudioTrackPlaybackParams: Boolean
                              ): AudioSink {
                                  return DefaultAudioSink.Builder(context)
                                      .setAudioProcessors(arrayOf<AudioProcessor>(tapProcessor))
                                      .build()
                              }
                          }

                          val player = ExoPlayer.Builder(this, renderersFactory)
                              .setMediaSourceFactory(DefaultMediaSourceFactory(httpFactory))
                              .setAudioAttributes(AudioAttributes.DEFAULT, false)
                              .build()

                          player.addListener(object : Player.Listener {
                              override fun onPlayerError(error: PlaybackException) {
                                  val detail = error.cause?.message ?: error.message ?: ""
                                  errorMsg.set("${error.errorCodeName} ($detail)")
                                  formatLatch.countDown()
                              }
                          })

                          activePlayer = player
                          player.setMediaItem(MediaItem.fromUri(playbackUrl))
                          player.prepare()
                          player.playWhenReady = true
                      } catch (e: Exception) {
                          errorMsg.set(e.message ?: "INIT_ERROR")
                          formatLatch.countDown()
                      }
                  }

                  try {
                      val ready = formatLatch.await(15, TimeUnit.SECONDS)
                      if (!ready || errorMsg.get() != null || activeSessionId != mySession) {
                          val reason = errorMsg.get() ?: "انتهت مهلة الاتصال بالبث (15 ثانية)"
                          val errBytes = reason.toByteArray(Charsets.UTF_8)
                          val resp = "HTTP/1.1 502 Bad Gateway\r\nContent-Type: text/plain; charset=utf-8\r\nAccess-Control-Allow-Origin: *\r\nContent-Length: ${errBytes.size}\r\nConnection: close\r\n\r\n"
                          out.write(resp.toByteArray())
                          out.write(errBytes)
                          out.flush()
                          return
                      }

                      val respHeader = "HTTP/1.1 200 OK\r\n" +
                          "Content-Type: application/octet-stream\r\n" +
                          "X-Sample-Rate: ${sampleRate.get()}\r\n" +
                          "X-Channels: ${channels.get()}\r\n" +
                          "Access-Control-Allow-Origin: *\r\n" +
                          "Access-Control-Expose-Headers: *\r\n" +
                          "Cache-Control: no-store, no-cache\r\n" +
                          "Connection: close\r\n\r\n"
                      out.write(respHeader.toByteArray())
                      out.flush()

                      var emptyPolls = 0
                      while (running && activeSessionId == mySession) {
                          val chunk = queue.poll(500, TimeUnit.MILLISECONDS)
                          if (chunk != null) {
                              emptyPolls = 0
                              out.write(chunk)
                              out.flush()
                          } else {
                              emptyPolls++
                              if (emptyPolls > 30) break
                          }
                      }
                  } finally {
                      mainHandler.post {
                          if (activeSessionId == mySession) {
                              releaseActivePlayer()
                          }
                      }
                  }
              }

              class TapAudioProcessor(
                  private val onFormatReady: (Int, Int) -> Unit,
                  private val onPcmData: (ByteArray) -> Unit
              ) : BaseAudioProcessor() {
                  private var isFloatInput = false

                  override fun onConfigure(inputAudioFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                      return when (inputAudioFormat.encoding) {
                          C.ENCODING_PCM_16BIT -> {
                              isFloatInput = false
                              onFormatReady(inputAudioFormat.sampleRate, inputAudioFormat.channelCount)
                              inputAudioFormat
                          }
                          C.ENCODING_PCM_FLOAT -> {
                              isFloatInput = true
                              onFormatReady(inputAudioFormat.sampleRate, inputAudioFormat.channelCount)
                              AudioProcessor.AudioFormat(
                                  inputAudioFormat.sampleRate,
                                  inputAudioFormat.channelCount,
                                  C.ENCODING_PCM_16BIT
                              )
                          }
                          else -> throw AudioProcessor.UnhandledAudioFormatException(inputAudioFormat)
                      }
                  }

                  override fun queueInput(inputBuffer: ByteBuffer) {
                      val remaining = inputBuffer.remaining()
                      if (remaining == 0) return
                      inputBuffer.order(ByteOrder.LITTLE_ENDIAN)

                      val pcmBytes: ByteArray
                      if (isFloatInput) {
                          val sampleCount = remaining / 4
                          pcmBytes = ByteArray(sampleCount * 2)
                          var idx = 0
                          while (inputBuffer.remaining() >= 4) {
                              val f = inputBuffer.float.coerceIn(-1f, 1f)
                              val s = (f * 32767f).toInt().toShort()
                              pcmBytes[idx++] = (s.toInt() and 0xFF).toByte()
                              pcmBytes[idx++] = ((s.toInt() shr 8) and 0xFF).toByte()
                          }
                      } else {
                          pcmBytes = ByteArray(remaining)
                          inputBuffer.get(pcmBytes)
                      }

                      onPcmData(pcmBytes)

                      val out = replaceOutputBuffer(pcmBytes.size)
                      out.put(ByteArray(pcmBytes.size))
                      out.flip()
                  }
              }

              override fun onDestroy() {
                  running = false
                  mainHandler.post { releaseActivePlayer() }
                  try { serverSocket?.close() } catch (_: Exception) {}
                  super.onDestroy()
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MySyncApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
